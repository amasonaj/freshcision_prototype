<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FRESHCISION</title>
<link rel="icon" type="image/png" href="assets/favicon-64.png?v=2">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">
<meta name="theme-color" content="#FBF6EA">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/features.css">
  <style>.page{grid-template-columns:minmax(0,1fr);justify-items:center;padding:16px 0}</style>
  <link rel="stylesheet" href="css/upgrade.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Caveat:wght@600;700&family=Courier+Prime:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/palengke.css">
  <link rel="stylesheet" href="css/readable.css">
</head>

<body>
<div id="splash" role="presentation"><img src="assets/logo-stack.png?v=2" alt="FRESHCISION"></div>
<script>try{if(sessionStorage.getItem("fc_splash")){document.getElementById("splash").remove()}else{sessionStorage.setItem("fc_splash","1");setTimeout(function(){var s=document.getElementById("splash");if(s){s.classList.add("out");setTimeout(function(){s.remove()},400)}},1500)}}catch(e){setTimeout(function(){var s=document.getElementById("splash");if(s)s.remove()},1500)}</script>
  <div class="page">
    <div class="phone" data-opt="d">
      <div id="top"></div>
      <div id="hatch"><b>No signal. Saving on this phone.</b></div>
      <div class="main" id="m"></div>
      <div id="dock"></div>
      <div id="undo" role="status" aria-live="polite"></div>
      <div class="act" id="act"></div>
      <div id="nav"></div>
      <div id="ov"></div><input type="file" id="cam" accept="image/*" capture="environment" hidden aria-label="Photo">
    </div>
  </div>
  <script src="js/state.js"></script>
  <script src="js/features.js"></script>
  <script src="js/app.js"></script>
  <script src="js/upgrade.js"></script>
  <script src="js/palengke.js"></script>
</body>

</html>
